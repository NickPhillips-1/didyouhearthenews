# Separate process from the operator's local database.
# Run: mvn spring-boot:run -Dspring-boot.run.profiles=canary
spring.datasource.url=jdbc:h2:file:./data/newsrater-canary;AUTO_SERVER=FALSE
spring.h2.console.enabled=false

# Keep the canary from refetching every article and from publishing the API document.
news-rater.flags.image-backfill=false
news-rater.flags.open-api-ui=false
