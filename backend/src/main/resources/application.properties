spring.application.name=news-rater

# H2 file database (gitignored)
spring.datasource.url=jdbc:h2:file:./data/newsrater;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 console for local debugging at /h2-console
spring.h2.console.enabled=true

server.port=8080

# Swagger UI: http://localhost:8080/swagger-ui.html
# Both follow news-rater.flags.open-api-ui so canary can turn the document off.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${news-rater.flags.open-api-ui:true}
springdoc.api-docs.enabled=${news-rater.flags.open-api-ui:true}

# Feature flags. Canary overrides these in application-canary.properties.
news-rater.flags.image-backfill=true
news-rater.flags.open-api-ui=true

management.endpoints.web.exposure.include=health
